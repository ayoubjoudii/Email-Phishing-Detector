<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 580px;
        min-height: 460px;

        font-family: "Share Tech Mono", monospace;
        background: #05000f;
        color: #c084fc;
        padding: 16px;
        border: 1px solid #7c3aed;
        background-image: url("vibrant-neon-colorful-liquid-background.jpg");
        background-size: cover;
        background-position: center;
        position: relative;
      }

      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(5, 0, 15, 0.52);
        z-index: 0;
        pointer-events: none;
      }
      body > * {
        position: relative;
        z-index: 1;
      }

      .header {
        border: 1px solid #7c3aed;
        padding: 10px 12px;
        margin-bottom: 12px;
        position: relative;
        background: rgba(124, 58, 237, 0.06);
      }

      .header::before {
        content: "■ SYSTEM ONLINE";
        position: absolute;
        top: -8px;
        left: 8px;
        background: #05000f;
        font-size: 9px;
        color: #a855f7;
        padding: 0 4px;
        letter-spacing: 2px;
      }

      .logo-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-box {
        width: 38px;
        height: 38px;
        border: 1px solid #7c3aed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: rgba(124, 58, 237, 0.12);
        flex-shrink: 0;
      }

      .title {
        font-family: "Orbitron", monospace;
        font-size: 15px;
        font-weight: 900;
        color: #c084fc;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .subtitle {
        font-size: 11px;
        color: #6d28d9;
        margin-top: 3px;
        letter-spacing: 1.5px;
      }

      .blink {
        animation: blink 1.2s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .analyze-btn {
        width: 100%;
        padding: 14px;
        background: transparent;
        color: #c084fc;
        border: 1px solid #7c3aed;
        font-family: "Orbitron", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        text-transform: uppercase;
        transition:
          background 0.15s,
          color 0.15s;
        margin-bottom: 10px;
        clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      }

      .analyze-btn:hover {
        background: #7c3aed;
        color: #fff;
      }
      .analyze-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .loading {
        display: none;
        border: 1px solid #7c3aed;
        padding: 10px 12px;
        margin-bottom: 10px;
        font-size: 11px;
        color: #a855f7;
        letter-spacing: 1px;
        background: rgba(124, 58, 237, 0.06);
      }

      .loading-bar {
        height: 2px;
        background: #100020;
        margin-top: 8px;
        overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%;
        background: #a855f7;
        width: 0%;
        animation: loading-anim 1.5s ease-in-out infinite;
      }
      @keyframes loading-anim {
        0% {
          width: 0%;
          margin-left: 0;
        }
        50% {
          width: 60%;
          margin-left: 20%;
        }
        100% {
          width: 0%;
          margin-left: 100%;
        }
      }

      .result-card {
        display: none;
        border: 1px solid #7c3aed;
        padding: 12px;
        margin-bottom: 10px;
        position: relative;
      }

      .result-card.phishing {
        border-color: #f43f5e;
        color: #f43f5e;
        background: rgba(244, 63, 94, 0.05);
      }
      .result-card.phishing::before {
        content: "⚠ THREAT DETECTED";
        position: absolute;
        top: -8px;
        left: 8px;
        background: #05000f;
        font-size: 9px;
        color: #f43f5e;
        padding: 0 4px;
        letter-spacing: 2px;
      }

      .result-card.legitimate {
        border-color: #a855f7;
        color: #c084fc;
        background: rgba(124, 58, 237, 0.06);
      }
      .result-card.legitimate::before {
        content: "✓ SCAN COMPLETE";
        position: absolute;
        top: -8px;
        left: 8px;
        background: #05000f;
        font-size: 9px;
        color: #a855f7;
        padding: 0 4px;
        letter-spacing: 2px;
      }

      .result-card.error {
        border-color: #f59e0b;
        color: #f59e0b;
        background: rgba(245, 158, 11, 0.05);
      }
      .result-card.error::before {
        content: "! SYSTEM ERROR";
        position: absolute;
        top: -8px;
        left: 8px;
        background: #05000f;
        font-size: 9px;
        color: #f59e0b;
        padding: 0 4px;
        letter-spacing: 2px;
      }

      .verdict-label {
        font-family: "Orbitron", monospace;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 6px;
      }

      .confidence-label {
        font-size: 9px;
        letter-spacing: 2px;
        opacity: 0.7;
        margin-bottom: 4px;
      }
      .confidence-bar {
        height: 4px;
        background: #0a001a;
        border: 1px solid currentColor;
        overflow: hidden;
      }
      .confidence-bar-fill {
        height: 100%;
        background: currentColor;
        transition: width 0.6s ease;
      }
      .confidence-pct {
        font-size: 10px;
        text-align: right;
        margin-top: 2px;
        opacity: 0.8;
      }

      .divider {
        border: none;
        border-top: 1px solid currentColor;
        opacity: 0.3;
        margin: 8px 0;
      }

      .section-title {
        font-size: 9px;
        letter-spacing: 2px;
        opacity: 0.6;
        margin-bottom: 6px;
        text-transform: uppercase;
      }

      .reasons-list {
        list-style: none;
        padding: 0;
      }
      .reasons-list li {
        font-size: 11px;
        padding: 3px 0 3px 14px;
        position: relative;
        line-height: 1.4;
        opacity: 0.9;
      }
      .reasons-list li::before {
        content: ">";
        position: absolute;
        left: 0;
        opacity: 0.7;
      }
      #redFlagsSection .reasons-list li::before {
        content: "!";
      }

      .footer {
        text-align: center;
        font-size: 9px;
        color: #3b0764;
        letter-spacing: 1.5px;
        padding-top: 8px;
        border-top: 1px solid #1e0040;
      }

      .corner-tl,
      .corner-tr,
      .corner-bl,
      .corner-br {
        position: absolute;
        width: 6px;
        height: 6px;
      }
      .corner-tl {
        top: -1px;
        left: -1px;
        border-top: 2px solid;
        border-left: 2px solid;
      }
      .corner-tr {
        top: -1px;
        right: -1px;
        border-top: 2px solid;
        border-right: 2px solid;
      }
      .corner-bl {
        bottom: -1px;
        left: -1px;
        border-bottom: 2px solid;
        border-left: 2px solid;
      }
      .corner-br {
        bottom: -1px;
        right: -1px;
        border-bottom: 2px solid;
        border-right: 2px solid;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 12px;
        padding: 10px 12px;
        border: 1px solid #3b0764;
        background: rgba(124, 58, 237, 0.06);
      }

      .toggle-label {
        font-family: "Share Tech Mono", monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        color: #9999bb;
      }

      .toggle-label span {
        font-size: 10px;
        margin-left: 6px;
      }

      .toggle-switch {
        position: relative;
        width: 42px;
        height: 22px;
        cursor: pointer;
      }

      .toggle-switch input {
        display: none;
      }

      .toggle-track {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #1a003a;
        border: 1px solid #7c3aed;
        border-radius: 11px;
        transition: background 0.3s;
      }

      .toggle-switch input:checked + .toggle-track {
        background: #7c3aed;
      }

      .toggle-thumb {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 14px;
        height: 14px;
        background: #c084fc;
        border-radius: 50%;
        transition: transform 0.3s;
      }

      .toggle-switch input:checked ~ .toggle-thumb {
        transform: translateX(20px);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo-row">
        <div class="logo-box">🛡</div>
        <div>
          <div class="title">Phishing<br />Detector</div>
          <div class="subtitle">
            GROQ LLAMA-3 // v1.0 <span class="blink">█</span>
          </div>
        </div>
      </div>
    </div>

    <button class="analyze-btn" id="analyzeBtn">[ SCAN CURRENT EMAIL ]</button>

    <div class="loading" id="loading">
      &gt; ANALYZING EMAIL... PLEASE WAIT
      <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>

    <div class="result-card" id="resultCard" style="position: relative">
      <div class="corner-tl"></div>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <span class="verdict-label" id="verdictLabel"></span>
      <div class="confidence-label">THREAT CONFIDENCE LEVEL</div>
      <div class="confidence-bar">
        <div
          class="confidence-bar-fill"
          id="confidenceBarFill"
          style="width: 0%"
        ></div>
      </div>
      <div class="confidence-pct" id="confidencePct"></div>
      <hr class="divider" />
      <div class="section-title">&gt; Analysis Output</div>
      <ul class="reasons-list" id="reasonsList"></ul>
      <div id="redFlagsSection" style="display: none; margin-top: 10px">
        <hr class="divider" />
        <div class="section-title">&gt; Red Flags Identified</div>
        <ul class="reasons-list" id="redFlagsList"></ul>
      </div>
    </div>

    <!-- Status bar — glows red or green -->
  <div class="status-bar" id="statusBar"></div>

  <div class="footer">OPEN EMAIL IN GMAIL → CLICK SCAN <span class="blink">_</span></div>

  <!-- Auto-scan toggle -->
  <div class="toggle-row">
    <div class="toggle-label">
      AUTO-SCAN
      <span id="toggleStatus">● ON</span>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="autoScanToggle" checked />
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
